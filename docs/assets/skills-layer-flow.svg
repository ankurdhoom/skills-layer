<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Skills Layer skill distribution flow</title>
  <desc id="desc">A clean four-step visual showing how a SKILL.md bundle moves through validation, catalog publication, CLI/MCP/REST access, and local agent installation.</desc>
  <defs>
    <linearGradient id="flowBg" x1="0" x2="1600" y1="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAF7"/>
      <stop offset="0.5" stop-color="#F2F7F6"/>
      <stop offset="1" stop-color="#F8F4EB"/>
    </linearGradient>
    <radialGradient id="flowGlowTeal" cx="0" cy="0" r="1" gradientTransform="matrix(360 0 0 220 1190 120)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FE7C8" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#6FE7C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flowGlowGold" cx="0" cy="0" r="1" gradientTransform="matrix(300 0 0 220 1350 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5B942" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" x2="170" y1="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C6A7"/>
      <stop offset="1" stop-color="#6FE7C8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="170" y1="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5368F6"/>
      <stop offset="1" stop-color="#30B8E8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="170" y1="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5B942"/>
      <stop offset="1" stop-color="#F97361"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#101828" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#101828" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#98A2B3"/>
    </marker>
    <style>
      .title { font: 790 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 560 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; letter-spacing: 0; }
      .step-number { font: 800 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .card-title { font: 760 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .card-copy { font: 520 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; letter-spacing: 0; }
      .terminal { font: 650 18px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #D1FAE5; }
      .terminal-muted { font: 650 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #98A2B3; }
    </style>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#flowBg)"/>
  <rect width="1600" height="560" rx="36" fill="url(#grid)"/>
  <rect width="1600" height="560" rx="36" fill="url(#flowGlowTeal)"/>
  <rect width="1600" height="560" rx="36" fill="url(#flowGlowGold)"/>

  <g transform="translate(104 70)">
    <text class="title" x="0" y="0">From SKILL.md to every agent</text>
    <text class="subtitle" x="0" y="42">A single governed path for publishing, trust, distribution, and local materialization.</text>
  </g>

  <g transform="translate(104 154)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="290" height="186" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="22" y="22" width="42" height="42" rx="21" fill="url(#teal)"/>
      <text class="step-number" x="43" y="50" text-anchor="middle">1</text>
      <text class="card-title" x="22" y="104">Create</text>
      <text class="card-copy" x="22" y="136">A Markdown-first bundle</text>
      <text class="card-copy" x="22" y="162">with references and assets.</text>
    </g>

    <line x1="318" y1="93" x2="384" y2="93" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(408 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="290" height="186" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="22" y="22" width="42" height="42" rx="21" fill="url(#blue)"/>
      <text class="step-number" x="43" y="50" text-anchor="middle">2</text>
      <text class="card-title" x="22" y="104">Validate</text>
      <text class="card-copy" x="22" y="136">Review triggers, metadata,</text>
      <text class="card-copy" x="22" y="162">provenance, and safety.</text>
    </g>

    <line x1="726" y1="93" x2="792" y2="93" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(816 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="290" height="186" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="22" y="22" width="42" height="42" rx="21" fill="url(#gold)"/>
      <text class="step-number" x="43" y="50" text-anchor="middle">3</text>
      <text class="card-title" x="22" y="104">Publish</text>
      <text class="card-copy" x="22" y="136">Catalog pages, trust data,</text>
      <text class="card-copy" x="22" y="162">and well-known manifests.</text>
    </g>

    <line x1="1134" y1="93" x2="1200" y2="93" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1224 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="290" height="186" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="22" y="22" width="42" height="42" rx="21" fill="#111827"/>
      <text class="step-number" x="43" y="50" text-anchor="middle">4</text>
      <text class="card-title" x="22" y="104">Install</text>
      <text class="card-copy" x="22" y="136">CLI, MCP, and REST deliver</text>
      <text class="card-copy" x="22" y="162">skills into agent folders.</text>
    </g>
  </g>

  <g transform="translate(242 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1116" height="88" rx="8" fill="#111827"/>
    <circle cx="32" cy="30" r="7" fill="#F97361"/>
    <circle cx="56" cy="30" r="7" fill="#F5B942"/>
    <circle cx="80" cy="30" r="7" fill="#19C6A7"/>
    <text class="terminal-muted" x="112" y="35">agent install</text>
    <text class="terminal" x="30" y="66">$ skills-layer install project-planner --agent codex</text>
    <text class="terminal" x="646" y="66">writes .codex/skills/project-planner</text>
  </g>
</svg>
