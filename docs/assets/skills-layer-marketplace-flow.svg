<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Skills Layer developer marketplace value flow</title>
  <desc id="desc">A clean visual showing how developers build skills, publish with guardrails, buyers install into agents, and creators can earn through Skills Layer Cloud.</desc>
  <defs>
    <linearGradient id="marketBg" x1="0" x2="1600" y1="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAF7"/>
      <stop offset="0.5" stop-color="#F2F7F6"/>
      <stop offset="1" stop-color="#F8F4EB"/>
    </linearGradient>
    <radialGradient id="marketGlowTeal" cx="0" cy="0" r="1" gradientTransform="matrix(380 0 0 240 1130 120)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FE7C8" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#6FE7C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="marketGlowGold" cx="0" cy="0" r="1" gradientTransform="matrix(320 0 0 230 1320 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5B942" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" x2="170" y1="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C6A7"/>
      <stop offset="1" stop-color="#6FE7C8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="170" y1="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5368F6"/>
      <stop offset="1" stop-color="#30B8E8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="170" y1="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5B942"/>
      <stop offset="1" stop-color="#F97361"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#101828" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#101828" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#98A2B3"/>
    </marker>
    <style>
      .title { font: 790 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 560 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; letter-spacing: 0; }
      .card-title { font: 760 26px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .card-copy { font: 520 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; letter-spacing: 0; }
      .tag { font: 800 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0.04em; }
      .pill { font: 760 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; letter-spacing: 0; }
      .dark { font: 760 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .dark-muted { font: 560 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #D0D5DD; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#marketBg)"/>
  <rect width="1600" height="560" rx="36" fill="url(#grid)"/>
  <rect width="1600" height="560" rx="36" fill="url(#marketGlowTeal)"/>
  <rect width="1600" height="560" rx="36" fill="url(#marketGlowGold)"/>

  <g transform="translate(104 70)">
    <text class="title" x="0" y="0">Build skills people can buy, trust, and install</text>
    <text class="subtitle" x="0" y="42">Community is the open foundation. Cloud adds managed marketplace, checkout, and creator earnings.</text>
  </g>

  <g transform="translate(104 158)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="326" height="218" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="24" y="24" width="108" height="34" rx="17" fill="url(#teal)"/>
      <text class="tag" x="78" y="47" text-anchor="middle">BUILD</text>
      <text class="card-title" x="24" y="104">Create a skill</text>
      <text class="card-copy" x="24" y="138">Turn hard-won expertise into</text>
      <text class="card-copy" x="24" y="164">a versioned SKILL.md bundle</text>
      <text class="card-copy" x="24" y="190">with provenance and docs.</text>
    </g>

    <line x1="352" y1="109" x2="424" y2="109" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(448 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="326" height="218" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="24" y="24" width="116" height="34" rx="17" fill="url(#blue)"/>
      <text class="tag" x="82" y="47" text-anchor="middle">PUBLISH</text>
      <text class="card-title" x="24" y="104">Trust first</text>
      <text class="card-copy" x="24" y="138">Validation, trust review,</text>
      <text class="card-copy" x="24" y="164">ownership, reviews, issues,</text>
      <text class="card-copy" x="24" y="190">and catalog distribution.</text>
    </g>

    <line x1="800" y1="109" x2="872" y2="109" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(896 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="326" height="218" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <rect x="24" y="24" width="94" height="34" rx="17" fill="url(#gold)"/>
      <text class="tag" x="71" y="47" text-anchor="middle">SELL</text>
      <text class="card-title" x="24" y="104">Reach buyers</text>
      <text class="card-copy" x="24" y="138">Cloud can handle discovery,</text>
      <text class="card-copy" x="24" y="164">checkout, entitlements, and</text>
      <text class="card-copy" x="24" y="190">purchase-backed trust.</text>
    </g>

    <line x1="1248" y1="109" x2="1320" y2="109" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1344 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="172" height="218" rx="8" fill="#111827"/>
      <circle cx="86" cy="58" r="34" fill="url(#gold)"/>
      <text class="dark" x="86" y="68" text-anchor="middle">$</text>
      <text class="dark" x="86" y="124" text-anchor="middle">Earn</text>
      <text class="dark-muted" x="86" y="154" text-anchor="middle">useful skills</text>
      <text class="dark-muted" x="86" y="178" text-anchor="middle">compound</text>
    </g>
  </g>

  <g transform="translate(250 430)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1100" height="64" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="24" y="17" width="112" height="30" rx="15" fill="#E8F8F5" stroke="#19C6A7"/>
    <text class="pill" x="80" y="38" text-anchor="middle" fill="#027A63">Community</text>
    <text class="card-copy" x="158" y="38">portable, agent-ready foundation</text>
    <rect x="612" y="17" width="74" height="30" rx="15" fill="#EEF1FF" stroke="#5368F6"/>
    <text class="pill" x="649" y="38" text-anchor="middle" fill="#3445D8">Cloud</text>
    <text class="card-copy" x="710" y="38">managed marketplace and monetization layer</text>
  </g>
</svg>
